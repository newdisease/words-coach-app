# fly.toml app configuration file generated for words-coach-db on 2026-09-13T21:43:50+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'words-coach-db'
primary_region = 'fra'

[env]
  FLY_SCALE_TO_ZERO = '1h'
  PRIMARY_REGION = 'fra'

[[mounts]]
  source = 'pg_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 5432
  auto_start_machines = true

  [[services.ports]]
    port = 5432
    handlers = ['pg_tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[services]]
  protocol = 'tcp'
  internal_port = 5433
  auto_start_machines = true

  [[services.ports]]
    port = 5433
    handlers = ['pg_tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[checks]
  [checks.pg]
    port = 5500
    type = 'http'
    interval = '15s'
    timeout = '10s'
    path = '/flycheck/pg'

  [checks.role]
    port = 5500
    type = 'http'
    interval = '15s'
    timeout = '10s'
    path = '/flycheck/role'

  [checks.vm]
    port = 5500
    type = 'http'
    interval = '15s'
    timeout = '10s'
    path = '/flycheck/vm'

[[metrics]]
  port = 9187
  path = '/metrics'

[build]
  image = 'flyio/postgres-flex:18.1@sha256:f2aaf3666b0fbf07a1c5450fe3b615335bbe961102c9156e81efcbcc0ad3965f'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[restart]]
  policy = 'on-failure'
  retries = 50
