app = 'words-coach-app'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '35s'
console_command = 'python manage.py shell'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'sh /app/deploy/release.sh'

[env]
  DJANGO_SETTINGS_MODULE = 'config.settings.production'
  DEBUG = 'False'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'
    [http_service.checks.headers]
      Host = 'localhost'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
